name: Escrow automation

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum interval is 5 minutes (and runs can be delayed)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the automation route
        run: |
          curl -fsS -X POST "${{ secrets.AUTOMATION_URL }}" \
            -H "x-automation-secret: ${{ secrets.AUTOMATION_SECRET }}"
